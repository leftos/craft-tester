# The ZOA route-building cheat sheet, one row per arrow: which fix connects onward to which. The
# engine walks these rows to keep the DP the SOP assigns when the filed route leaves on a fix that is
# not one of its published transitions. Shared by every airport: the sheet says the fixes work with
# any compatible DP, so an airport inherits every row rather than restating them. `connects: always`
# is the sheet's `ac`, `connects: usually` its `c`; `to` may be an airway, which the join rule then
# reads as "(airway) (next fix)".
source: "OAK Route Building Cheat Sheet (vZOA S1-OAK-5), Common Fixes, routes dated 2025-01-20; retrieved 2026-09-16"
connections:
  # Common S/SW fixes
  - { from: YYUNG, to: TILLT, connects: usually }
  - { from: YYUNG, to: LAX,   connects: usually }
  # N903JP to Santa Barbara: with COAST9 off, the user's answer is CNDEL5 YYUNG GVO HABUT (user, 2026-09-17)
  - { from: YYUNG, to: GVO,   connects: usually }
  - { from: MCKEY, to: TILLT, connects: usually }
  - { from: MCKEY, to: LAX,   connects: usually }
  - { from: KTINA, to: CISKO, connects: always }
  - { from: CISKO, to: RDHOT, connects: usually }
  - { from: SUSEY, to: EBAYE, connects: always }
  - { from: EBAYE, to: BURGL, connects: usually }
  - { from: EBAYE, to: AVE,   connects: usually }
  - { from: KAYEX, to: LOSHN, connects: always }
  - { from: LOSHN, to: BOILE, connects: usually }
  - { from: LOSHN, to: CLASN, connects: usually }
  - { from: LOSHN, to: EHF,   connects: usually }
  # SKYLINE ONE chart: WAGES, the SID's own end fix, lies on the way to LOSHN, so a conventional
  # southbound flight filed through LOSHN keeps a SID instead of a heading (user, 2026-09-17, PXT415:
  # "WAGES is also on SKYL1 and seems to be preferred as an exit fix when PXN isn't involved").
  - { from: WAGES, to: LOSHN, connects: usually }
  - { from: NTELL, to: Q174,  connects: usually }
  # Q174 carries a Las Vegas arrival to FLCHR, the COKTL# entry fix the ZOA-ZLA LOA names (".Q174.FLCHR"); JSX203: CNDEL5 NTELL Q174 FLCHR COKTL4 (user, 2026-09-17)
  - { from: Q174, to: FLCHR, connects: usually }
  # Common N/NE fixes
  - { from: DEDHD, to: RBL,   connects: usually }
  - { from: ORRCA, to: Q120,  connects: usually }
  - { from: SAC,   to: Q120,  connects: usually }
  # ANAHO connects onward to PRNCS, the SADYL# entry fix the ZOA-ZLC LOA names for Boise, as the KSFO route library files it (SAC ANAHO PRNCS SADYL#); SWA1254: OAK6 OAK SAC ANAHO PRNCS SADYL4 (user, 2026-09-17)
  - { from: ANAHO, to: PRNCS, connects: usually }
  - { from: MOGEE, to: Q122,  connects: usually }
  - { from: MOGEE, to: Q124,  connects: usually }
  # Q124 carries the Salt Lake route on to BVL, as both route libraries file it (KOAK OAK MOGEE Q124 BVL YUTES2, KSFO MOGEE Q124 BVL BVL2); UAL313: OAK6 OAK MOGEE Q124 BVL WAATS5 (user, 2026-09-17, UAL313)
  - { from: Q124,  to: BVL,   connects: usually }
  - { from: TIPRE, to: Q126,  connects: usually }
  - { from: SYRAH, to: Q128,  connects: usually }
  - { from: SYRAH, to: Q130,  connects: usually }
  - { from: LIN,   to: J84,   connects: usually }
  # Common W (oceanic) fixes
  - { from: ALCOA, to: R463,  connects: usually }
  - { from: BEBOP, to: R464,  connects: usually }
  - { from: CINNY, to: A220,  connects: usually }
