# Spoken names for navaids the CIFP does not carry that a checked-in route still files: US facilities
# since decommissioned, and foreign ones. A navaid belongs to the route structure, not to one field, so
# every airport inherits the table. The CIFP name is read first, then this table, then the airport's own
# `overrides.yaml` `fix_spoken`, and the later one wins; a row reaches an airport's document only when
# that airport's data or fixtures file the navaid. Names follow R-NAVAID: the name, then VOR for any
# VOR, VOR/DME or VORTAC, or NDB.
