# The destinations an airport's scenarios can file to: the spoken name, the center whose LOA rules apply
# to the flight, and the coordinates of a field outside the FAA CIFP. None of that depends on the departure
# airport, so a destination is stated once here and an airport's `routes.yaml` lists only the codes its
# scenarios file to. US coordinates are filled from CIFP by the generator; a foreign field has nothing to
# resolve against and gives `lat` and `lon` here.
# `spoken` is the name the engine reads: the FAA's name for the field in full (the CIFP airport record,
# its abbreviations written out and its slashes and brackets dropped; the record stops at 30 characters, so
# a longer name is completed from FAA NASR `ARPT_NAME`). A foreign field takes its published name. `short`
# is the name the amendment reasons use ("the TEC route to Sacramento is flown at 10,000"), and is the
# `spoken` name where a row gives none. `also` lists every further name a typed clearance may give the
# field, local usage among them. A typed clearance may say any of the three, and each grades as the name
# itself (user, 2026-09-18).
# Whether a field is inside NCT is computed at build time from the terminal polygons of `nct_boundary.yaml`,
# never flagged by hand. A field the polygon holds laterally but another facility owns down to the ground
# states `outside_nct` with the reason, and the build treats it as outside. The flag gates the TEC route
# lookup, so a TEC row to a field without it is never issued.
