# The ALTITUDE columns of SOP 2-2 a, 2-2 b and Appendix B d. Ordered; first match wins, so the rows
# naming a DP come before the rows that answer a flight cleared on a heading. "CVS" is climb via SID
# and "CVS x" is climb via SID except maintain. SOP 2-2 b i: instruct aircraft to expect the
# assigned/cruise altitude 10 minutes after departure.
altitude_rules:
  - id: OAK-ALT-SFOW-OAK-DH8D
    source: OAK ATCT SOP 2-2 a i (SFOW Northbound)
    text: "SFOW: OAK#, runways 28/30, DH8D -> CVS x 10,000"
    plan: SFOW
    runway_families: ["28", "30"]
    classes: []
    groups: [dh8d]
    sid_families: [OAK]
    outcome: { kind: interim, feet: 10000 }
    when_top_altitude_published: interim
    expect_after_minutes: 10
  - id: OAK-ALT-SFOW-OAK-J
    source: OAK ATCT SOP 2-2 a i (SFOW Northbound)
    text: "SFOW: OAK#, runways 28/30, J -> CVS x FL190"
    plan: SFOW
    runway_families: ["28", "30"]
    classes: [J]
    sid_families: [OAK]
    outcome: { kind: interim, feet: 19000 }
    when_top_altitude_published: interim
    expect_after_minutes: 10
  - id: OAK-ALT-SFOW-CNDEL
    source: OAK ATCT SOP 2-2 a i (SFOW Oceanic/Southbound)
    text: "SFOW: CNDEL#, runways 28/30, J & DH8D -> CVS"
    plan: SFOW
    runway_families: ["28", "30"]
