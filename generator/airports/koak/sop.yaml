  - id: OAK-APPB-SFOW-30-PT-270-S
    source: OAK ATCT SOP Appendix B d i (footnote 2)
    text: "Noise abatement (2200L-0700L, 0800L Sun): All, runway 30, P/T -> 270 degrees, 10,000; Sutro for oceanic/southbound departures"
    plan: SFOW
    direction: south
    runway_families: ["30"]
    classes: [P, T]
    sid_family: null
    non_dp_heading: 270
    sector: sutro
    when: { noise_window: sfow_night }
  - id: OAK-APPB-SFOW-30-PT-270-O
    source: OAK ATCT SOP Appendix B d i (footnote 2)
    text: "Noise abatement (2200L-0700L, 0800L Sun): All, runway 30, P/T -> 270 degrees, 10,000; Sutro for oceanic/southbound departures"
    plan: SFOW
    direction: oceanic
    runway_families: ["30"]
