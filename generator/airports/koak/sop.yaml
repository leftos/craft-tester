# Operational notices that change which SIDs are available. `sid_off` removes every assignment row
# for that SID family while the notice is active, so the next compatible row applies: the OAKE
# 270-degree row for QUAKE#, and the southbound 270-degree row for SUNNE#.
notices:
  - id: OAK-QUAKE-OFF
    source: ZOA notice relayed by the user, 2026-09-15
    dated: 2026-09-15
    text: "OAK QUAKE SID: OFF. Issue 270 HDG RV first fix for 12/10 jet departures. CFG: OAKE"
    plan: OAKE
    effect: { kind: sid_off, sid_family: QUAKE, heading: 270 }
    default_active: true
  - id: OAK-SUNNE-OFF
    source: ZOA notice relayed by the user, 2026-09-15
    dated: 2026-09-15
    text: "OAK SUNNE SID: OFF. Issue 120 HDG RV first fix for jet 30 departures. CFG: SFOW noise abatement"
    plan: SFOW
    effect: { kind: sid_off, sid_family: SUNNE, heading: 120 }
    default_active: true

# Airport-level phraseology toggles. Defaults follow FAA JO 7110.65 4-3-2, except the expect time:
# SOP 2-2 b i instructs aircraft to expect the assigned altitude ten minutes after departure.
phraseology:
  expect_altitude: unless_chart_publishes_it
  non_standard_interim_expect_minutes: 10
  vector_hybrid_transitions_spoken: false

# The airport's own phraseology rule rows. The CRAFT rows every airport inherits live in
# `generator/shared/phraseology_rules.yaml`; this file states only the six `RWY-*` rows the engine
# cites by id to explain the departure runway, in the order the engine tries them: the airline
# default, then the group default, then the class default, then the rest.
phraseology_rules:
  - id: RWY-AIRLINE-DEFAULT
    source: "ZOA senior staff via the user, 2026-09-16"
    text: "PAC VALLEY's props depart runway 28L, and its east-flow reciprocal 10R, because the airline parks south of that runway; an airline default is issued ahead of the class and group defaults"
  - id: RWY-GROUP-DEFAULT
    source: "OAK ATCT SOP 3-4 a"
    text: "SOP 3-4 a requests turbojets, turbofans and turboprops over 17,000 lbs not to depart runways 28L/28R, so the Dash 8-400 is grouped with the jets and departs the south field with them: runway 30 in SFOW, runway 12 in OAKE and SFOE"
  - id: RWY-CLASS-DEFAULT
    source: "OAK ATCT SOP 3-4 a; ZOA senior staff via the user, 2026-09-16"
    text: "The configuration departs this aircraft class from this runway by default: props and turboprops take the north field, runway 28R in SFOW and its east-flow reciprocal 10L in OAKE and SFOE, because they park north of that runway"
  - id: RWY-ON-REQUEST
    source: OAK ATCT SOP 1-6 and 3-4 b
    text: "OAK has no runway issued only on request: SOP 3-4 b lets a controller deviate from the runway-assignment practice for safety, weather, emergencies, flow, construction and pilot requests, but the SOP names no class or route that is given another runway on request"
  - id: RWY-DIRECTION
    source: OAK ATCT SOP 1-6 and 2-2
    text: "OAK's SOP states no turn-direction split between the parallel runways, so the direction of the departure does not change the runway: within a family the class default applies in every direction"
  - id: RWY-FIRST
    source: OAK ATCT SOP 1-6
    text: "The configuration departs a single runway of this family for this aircraft class, so that runway is issued"
