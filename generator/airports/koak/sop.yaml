  - { label: NorCal Departure (Sutro), value: "135.1" }
  - { label: NorCal Approach (Grove), value: "125.35" }
  - { label: NorCal Approach (Boulder), value: "133.95" }
  - { label: NorCal Approach (Woodside), value: "135.65" }
  - { label: NorCal Departure (Diablo), value: "127.0" }
  - { label: NorCal Departure (Fairfield), value: "124.325" }
  - { label: NorCal Departure (Quake), value: "127.975" }
  - { label: Oakland Center (combined), value: "132.2" }

# Exit fix -> SOP direction. Seeded with every CIFP transition fix of the eleven coded procedures and
# with the fixes the user's "Common Fixes" notes and the ZOA route tool file after the vector and
# radar-vector SIDs (OAK#, NIMI#, QUAKE#). A fix KSFO also gates keeps the KSFO direction; the rest
# follow the SOP's own grouping: the OAK#/HUSSH#/SLNT# fixes are northbound, the CNDEL#/SKYL#/
# COAST#/KATFH#/NUEVO# fixes southbound, and the W oceanic fixes oceanic. Extend during validation.
gates:
  # HUSSH2 and SLNT3 transitions, the TEC heads that leave to the north and east, and the Altamont
  # corridor (ALTAM, MOD), which the TEC rows work east out of the Bay the way KSFO works OAK.
  # CCR, RDD and LKV are worksheet exit fixes north of the field (KSFO lists them the same way).
  north: [DEDHD, GOBBS, GRTFL, MOGEE, ORRCA, SYRAH, TIPRE, ENI, LIN, RBL, SAC, OAK, SAU, SGD, ALTAM, MOD, FEVTA, SUNOL, COLLI, OAKEY, CCR, RDD, LKV]
  # CNDEL5 and KATFH3 transitions (and their common fix PORTE), COAST9 and SKYL1 transitions,
  # NUEVO8 transitions and the fixes the SOP's NUEVO# row names; SUNNE (the SUNNE1 end fix) and the
  # valley and coastal fixes worksheet plans leave on (CISKO, EBAYE, LOSHN, LHS, BOILE, EHF, GILRO).
  south: [KAYEX, KTINA, NTELL, SUSEY, YYUNG, PORTE, FLW, GVO, RZS, SXC, MCKEY, AVE, PXN, WAGES, SHOEY, SNS, EUGEN, BSR, OSI, SJC, ARTAQ, KARNN, SUNNE, CISKO, EBAYE, LOSHN, LHS, BOILE, EHF, GILRO]
  # The user's notes: ALCOA to R463, BEBOP to R464, CINNY to A220, AMAKR to the north-west oceanic.
  oceanic: [ALCOA, AMAKR, BEBOP, CINNY]

# SOP 2-1 c: an initial heading is issued when a DP cannot be used or none applies, and is read
# "RADAR VECTORS (first fix/airway)". Every departure runway family can be cleared that way.
no_sid:
  runway_families: ["10", "12", "15", "28", "30", "33"]
  phrasing: radar_vectors_fix

# Appendix B b. Local times; `sunday_end` replaces `end` on Sundays. The SOP gives no window for the
# OAKE table of Appendix B d ii, so those rows run in the SFOW window (OAKE has SFO on the 28s).
noise_windows:
  - { id: sfow_night, start: "22:00", end: "07:00", sunday_end: "08:00" }
  - { id: sfoe_night, start: "22:00", end: "06:00" }
  - { id: salad, start: "22:00", end: "07:00" }
  - { id: hussh_required, start: "01:00", end: "05:00" }

# Named sets of aircraft the SOP tables address as one. SOP 2-2 and Appendix B write "J & DH8D"
# throughout: the Dash 8-400 is cleared like a jet but keeps its own interim altitude on OAK#.
aircraft_groups:
  jets_and_dh8d: { classes: [J], types: [DH8D] }
  dh8d: { classes: [], types: [DH8D] }

# SOP 2-2 a (standard DP/route/heading by destination direction, runway and aircraft), 2-2 b
# (non-DP headings) and Appendix B d (noise abatement). Ordered: the engine takes the first row whose
# conditions match and whose SID is compatible with the departure runway, the aircraft's RNAV
# capability and the filed exit fix, so the noise rows come first, then the 2-2 a tables, then the
# 2-2 b headings as the fall-through. Within a noise row that offers a DP or a heading, the DP row is
# written first: a heading row matches every flight, so a heading written first would swallow the DP.
assignment_rules:
  # Appendix B d i, footnote *: HUSSH# is required for J/DH8D between 0100L and 0500L, and the
  # 270-degree alternatives of the same table are not authorised then (footnote 3).
  - id: OAK-APPB-SFOW-HUSSH-REQ-N
    source: OAK ATCT SOP Appendix B d i (footnote *)
    text: "HUSSH# DP (unless SUNNE# DP authorized by NCT) is required for J/DH8D between 0100L and 0500L: northbound, runway 30 -> HUSSH# (Richmond)"
    plan: SFOW
    direction: north
    runway_families: ["30"]
    classes: []
    groups: [jets_and_dh8d]
    sid_family: HUSSH
    sector: richmond
    when: { noise_window: hussh_required, rnav: true }
  - id: OAK-APPB-SFOW-HUSSH-REQ-S
    source: OAK ATCT SOP Appendix B d i (footnote *)
    text: "HUSSH# DP is required for J/DH8D between 0100L and 0500L; oceanic/southbound routed via GOBBS transition: southbound, runway 30 -> HUSSH# GOBBS (Sutro)"
    plan: SFOW
    direction: south
    runway_families: ["30"]
    classes: []
    groups: [jets_and_dh8d]
    sid_family: HUSSH
    sector: sutro
    when: { noise_window: hussh_required, rnav: true, forced_transition: GOBBS }
  - id: OAK-APPB-SFOW-HUSSH-REQ-O
    source: OAK ATCT SOP Appendix B d i (footnote *)
    text: "HUSSH# DP is required for J/DH8D between 0100L and 0500L; oceanic/southbound routed via GOBBS transition: oceanic, runway 30 -> HUSSH# GOBBS (Sutro)"
    plan: SFOW
    direction: oceanic
    runway_families: ["30"]
    classes: []
    groups: [jets_and_dh8d]
    sid_family: HUSSH
    sector: sutro
    when: { noise_window: hussh_required, rnav: true, forced_transition: GOBBS }

  - id: OAK-APPB-SFOW-30-N-HUSSH
    source: OAK ATCT SOP Appendix B d i
    text: "Noise abatement (2200L-0700L, 0800L Sun): Northbound, runway 30, J & DH8D -> HUSSH# (Richmond), CVS"
    plan: SFOW
    direction: north
    runway_families: ["30"]
    classes: []
    groups: [jets_and_dh8d]
    sid_family: HUSSH
    sector: richmond
    when: { noise_window: sfow_night, rnav: true }
  - id: OAK-APPB-SFOW-30-N-SLNT
    source: OAK ATCT SOP Appendix B d i
    text: "Noise abatement (2200L-0700L, 0800L Sun): Northbound, runway 30, J & DH8D -> SLNT# (Richmond), CVS x FL190; not authorized between 0100L and 0500L"
    plan: SFOW
    direction: north
    runway_families: ["30"]
    classes: []
    groups: [jets_and_dh8d]
    sid_family: SLNT
    sector: richmond
    when: { noise_window: sfow_night }
  - id: OAK-APPB-SFOW-30-S-HUSSH
    source: OAK ATCT SOP Appendix B d i
    text: "Noise abatement (2200L-0700L, 0800L Sun): Southbound, runway 30, J & DH8D -> HUSSH# (Sutro), CVS"
    plan: SFOW
    direction: south
    runway_families: ["30"]
    classes: []
    groups: [jets_and_dh8d]
    sid_family: HUSSH
    sector: sutro
    when: { noise_window: sfow_night, rnav: true }
  - id: OAK-APPB-SFOW-30-O-HUSSH
    source: OAK ATCT SOP Appendix B d i
    text: "Noise abatement (2200L-0700L, 0800L Sun): Oceanic, runway 30, J & DH8D -> HUSSH# (Sutro), CVS"
    plan: SFOW
    direction: oceanic
    runway_families: ["30"]
    classes: []
    groups: [jets_and_dh8d]
    sid_family: HUSSH
    sector: sutro
    when: { noise_window: sfow_night, rnav: true }
  - id: OAK-APPB-SFOW-30-S-270
    source: OAK ATCT SOP Appendix B d i
    text: "Noise abatement (2200L-0700L, 0800L Sun): Southbound, runway 30, J & DH8D -> 270 degrees (Sutro), 10,000; not authorized between 0100L and 0500L"
    plan: SFOW
    direction: south
