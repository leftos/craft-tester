  - id: OAK-APPB-SFOW-28-SALAD
    source: OAK ATCT SOP Appendix B b iii and d i
    text: "SALAD# is in use 2200L until 0700L daily: All, runway 28, P and approach category A/B -> SALAD# (Richmond), CVS x 4,000"
    plan: SFOW
    direction: any
    runway_families: ["28"]
