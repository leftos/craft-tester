  - id: OAK-APPB-SFOW-28-N-270
    source: OAK ATCT SOP Appendix B d i
    text: "Noise abatement (2200L-0700L, 0800L Sun): Northbound, runway 28, J & DH8D -> 270 degrees (Richmond), 10,000"
