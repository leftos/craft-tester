  - id: OAK-APPB-SFOW-30-PT-270-N
    source: OAK ATCT SOP Appendix B d i (footnote 2)
    text: "Noise abatement (2200L-0700L, 0800L Sun): All, runway 30, P/T -> 270 degrees, 10,000; Richmond for northbound departures"
    plan: SFOW
