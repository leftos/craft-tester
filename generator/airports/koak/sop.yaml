  - id: OAK-APPB-SFOW-2830-S-SUNNE
    source: OAK ATCT SOP Appendix B d i (footnote 1)
    text: "Noise abatement (2200L-0700L, 0800L Sun): Southbound, runways 28/30, J & DH8D -> SUNNE# (Sutro), 5,000; SUNNE# DP will be authorized by NCT when traffic levels allow"
    plan: SFOW
    direction: south
    runway_families: ["28", "30"]
    classes: []
    groups: [jets_and_dh8d]
    sid_family: SUNNE
    sector: sutro
    when: { noise_window: sfow_night }
  - id: OAK-APPB-SFOW-2830-S-270
    source: OAK ATCT SOP Appendix B d i
    text: "Noise abatement (2200L-0700L, 0800L Sun): Southbound, runways 28/30, J & DH8D -> 270 degrees (Sutro), 10,000"
    plan: SFOW
    direction: south
    runway_families: ["28", "30"]
    classes: []
    groups: [jets_and_dh8d]
    sid_family: null
