# Hand transcription of the Oakland ATCT SOP: section 1-5 (positions), 1-6 (runway configurations),
# 2-1 (general procedures), 2-2 (IFR departures), 3-4 (runway assignment) and Appendix B (noise
# abatement). Every rule row carries the SOP text it came from so the game can cite it.
# Re-transcribe when `craft-gen verify-sop` reports a hash change.
source:
  title: Oakland ATCT Standard Operating Procedure
  version: "1.7"
  url: https://oakartcc.org/controllers/file/1217f464-6766-11e9-8010-2a32edb55910
  sha256: 21f5fdfb40c879e7418e02339a41e48261975797505fc6b1ea76f0b409ab5935
  transcribed_at: 2026-09-16
  sentinels:
    - "Version 1.7"
    - "2-2 IFR Departures"
    - "CVS x FL190 (J)"
    - "Initial headings specified in this SOP shall only be issued"
    - "SALAD# is in use 2200L until 0700L daily"

# No OAK CBT deck has been read yet, so no row cites one. The two secondary sources below are the
# shared ZOA references the phraseology and route-building rules come from.
secondary_sources:
  - id: craft_phraseology
    title: ZOA CRAFT Phraseology reference
    dated: 2026-09-15
    url: https://docs.google.com/document/d/1Jq0uqpuhIZRSfKvYbyJvAplT1h6zf-wMhcAN6MAQC6k
  - id: route_building
    title: OAK Route Building Cheat Sheet (vZOA S1-OAK-5)
    dated: 2025-01-20
    url: https://docs.google.com/document/d/1rJm0csgkxlLMctyXmiPh-THOHpc4jxQDs9PYbGHO1Hs

airport:
  icao: KOAK
  faa: OAK
  spoken: Oakland
  clearance_delivery: "121.1"

runways: ["10L", "10R", "12", "15", "28L", "28R", "30", "33"]

# SOP 1-6 names three configurations by what SFO and OAK are using; the ZOA route tool tags its TEC
# rows with the same three names, so the configuration id and the plan are the same string.
# Departure runways come from the SOP 2-2 tables (SFOW 28L/28R/30, OAKE and SFOE 10L/10R/12) plus
# runway 33, which SOP 2-2 b ii assigns headings for in SFOW. Defaults follow SOP 3-4 a, which asks
# turbojets, turbofans and turboprops over 17,000 lbs not to depart 28L/28R: the jets_and_dh8d group
# takes the south field (30 in SFOW, 12 in OAKE/SFOE) and props and the lighter turboprops take the
# north field (28R in SFOW, its east-flow reciprocal 10L in OAKE/SFOE), north of which they park.
# PAC VALLEY parks its Caravans south of the other north-field pavement, so that airline defaults to
# 28L in SFOW and to its reciprocal 10R in OAKE/SFOE.
# training_weight is how often the scenario generator draws the configuration relative to the others,
# a training mix rather than SOP data.
runway_configs:
  - id: SFOW
    source: "OAK ATCT SOP 1-6"
    name: SFO utilizing runways 01s and/or 28s, OAK utilizing runways 28s and 30
    plan: SFOW
    training_weight: 70
    arrival_runways: ["28L", "28R", "30"]
    departure_runways:
      - { runway: "28L", classes: [P, T, J] }
      - { runway: "28L", classes: [T], default_for_airlines: [PCM], note: "PAC VALLEY's Caravans park south of 28L (ZOA senior staff via the user, 2026-09-16)" }
      - { runway: "28R", classes: [P, T, J] }
      - { runway: "28R", classes: [P, T], default_for_classes: [P, T], note: "props and turboprops depart 28R because they park north of it (ZOA senior staff via the user, 2026-09-16); SOP 3-4 a asks turbojets and turboprops over 17,000 lbs not to depart 28L/28R. A DH8D is class T but departs with the jets: the runway 30 row defaults the jets_and_dh8d group, which is answered before a class default" }
      - { runway: "30", classes: [P, T, J] }
      - { runway: "30", classes: [J, T], default_for_groups: [jets_and_dh8d], note: "SOP 3-4 a asks turbojets, turbofans and turboprops over 17,000 lbs not to depart 28L/28R, so the jets take the south field and the Dash 8-400, a turboprop over 17,000 lbs, departs with them" }
      - { runway: "33", classes: [P, T, J], note: "SOP 2-2 b ii gives runway 33 its own heading rows (J & DH8D 270 degrees, P/T 315 degrees), so the runway departs every class; it is a short north-field runway and is issued on request or for a GA flight parked beside it" }
  - id: OAKE
    source: "OAK ATCT SOP 1-6"
    name: SFO utilizing runways 28s, OAK utilizing runways 10s and 12
    plan: OAKE
    training_weight: 20
    arrival_runways: ["10L", "10R", "12"]
    departure_runways:
      - { runway: "10L", classes: [P, T, J] }
      - { runway: "10L", classes: [P, T], default_for_classes: [P, T], note: "props and turboprops depart 10L, the same pavement as the 28R they take in west flow, because they park north of it (ZOA senior staff via the user, 2026-09-16); SOP 3-4 a asks turbojets and turboprops over 17,000 lbs not to depart the 28s, whose east-flow reciprocals are the 10s" }
      - { runway: "10R", classes: [P, T, J] }
      - { runway: "10R", classes: [T], default_for_airlines: [PCM], note: "PAC VALLEY's Caravans park south of 10R, the same pavement as the 28L they take in west flow (ZOA senior staff via the user, 2026-09-16)" }
      - { runway: "12", classes: [P, T, J] }
      - { runway: "12", classes: [J, T], default_for_groups: [jets_and_dh8d], note: "SOP 3-4 a asks turbojets, turbofans and turboprops over 17,000 lbs not to depart 28L/28R, whose east-flow reciprocals are the 10s, so the jets take the south field and the Dash 8-400, a turboprop over 17,000 lbs, departs with them" }
  - id: SFOE
    source: "OAK ATCT SOP 1-6"
    name: SFO utilizing runways 19s and/or 10s, OAK utilizing runways 10s and 12
    plan: SFOE
    training_weight: 10
    arrival_runways: ["10L", "10R", "12"]
    departure_runways:
      - { runway: "10L", classes: [P, T, J] }
      - { runway: "10L", classes: [P, T], default_for_classes: [P, T], note: "props and turboprops depart 10L, the same pavement as the 28R they take in west flow, because they park north of it (ZOA senior staff via the user, 2026-09-16); SOP 3-4 a asks turbojets and turboprops over 17,000 lbs not to depart the 28s, whose east-flow reciprocals are the 10s" }
      - { runway: "10R", classes: [P, T, J] }
      - { runway: "10R", classes: [T], default_for_airlines: [PCM], note: "PAC VALLEY's Caravans park south of 10R, the same pavement as the 28L they take in west flow (ZOA senior staff via the user, 2026-09-16)" }
      - { runway: "12", classes: [P, T, J] }
      - { runway: "12", classes: [J, T], default_for_groups: [jets_and_dh8d], note: "SOP 3-4 a asks turbojets, turbofans and turboprops over 17,000 lbs not to depart 28L/28R, whose east-flow reciprocals are the 10s, so the jets take the south field and the Dash 8-400, a turboprop over 17,000 lbs, departs with them" }

# NCT departure sectors named in SOP 2-2. Frequencies from the ZOA positions reference
# (Area D Richmond 120.900, Area D Sutro 135.100, Area C Grove 125.350) and the OAK charts' NORCAL
# DEP CON boxes (OAKLAND SIX/SILENT THREE/SALAD FIVE 120.9, CNDEL/COAST/KATFH/NUEVO/QUAKE/SKYLINE/
# SUNNE 135.1, NIMITZ SIX 127.0, which is the Diablo low-altitude sector rather than a SOP sector).
departure_sectors:
  - { id: richmond, name: NorCal Richmond, frequency: "120.9" }
  - { id: sutro, name: NorCal Sutro, frequency: "135.1" }
  - { id: grove, name: NorCal Grove, frequency: "125.35" }

# No OAK CBT has been read, so no staffing fallback is transcribed yet.
departure_staffing_fallbacks: []

# The SOP states no turn-direction split for OAK, so every direction takes the same runway of a
# family: the class defaults of SOP 3-4 a (props on the north field, jets on the south field).
direction_runway_preference:
  SFOW:
    north: { "28": "28R", "30": "30", "33": "33" }
    south: { "28": "28R", "30": "30", "33": "33" }
    oceanic: { "28": "28R", "30": "30", "33": "33" }
  OAKE:
    north: { "10": "10R", "12": "12" }
    south: { "10": "10R", "12": "12" }
    oceanic: { "10": "10R", "12": "12" }
  SFOE:
    north: { "10": "10R", "12": "12" }
    south: { "10": "10R", "12": "12" }
    oceanic: { "10": "10R", "12": "12" }

# Distractor pool for the frequency dropdown: the OAK positions (SOP 1-5), the three SOP departure
