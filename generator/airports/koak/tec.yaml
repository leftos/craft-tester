# Tower Enroute Control (TEC) routes for KOAK departures to destinations inside NCT, transcribed from
# the ZOA route reference tool (https://reference.oakartcc.org/routes?dep=OAK&dest=<FAA>) on
# 2026-09-16. The tool prints `[SFOW]`, `[SFOE]` and `[OAKE]` plans and ends a row with a pair of
# altitudes in hundreds of feet: the initial altitude the TEC route is issued with and the final
# altitude it assigns (`030/090` = 3,000 initial, 9,000 final). `initial_altitude_feet` holds the
# first number of the pair and `final_altitude_feet` the second; where the tool prints a single
# number that number is both (`070` = 7,000 initial and final), and a row the tool prints without an
# altitude carries neither key. SIDs are written with `#` in place of the version so a cycle bump
# does not stale the row; an arrival keeps the revision the tool prints. A
# leading `H270`/`H090` is the initial heading the tool issues where the route carries no DP, which
# is the case SOP 2-1 c describes. `runway_families` is empty on every row: the tool tags a departure
# runway at KSFO but none at OAK, so a row applies to every departure runway of its plan.
# A TEC route is issued to a destination inside NCT, which the build computes from the terminal
# polygons of `generator/shared/nct_boundary.yaml`. Napa (KAPC) and Santa Rosa (KSTS) lie outside
# those polygons; Concord (KCCR) lies inside them laterally, but Travis Approach owns a shelf below
# that boundary down to the ground over the field, so it is no NCT destination either. The rows the
# tool prints for those three fields are not transcribed here.
source:
  title: ZOA Reference Tool, TEC/AAR/ADR Routes
  url: https://reference.oakartcc.org/routes
  transcribed_at: 2026-09-16

