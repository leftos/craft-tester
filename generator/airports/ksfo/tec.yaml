# Tower Enroute Control (TEC) and ADR routes for KSFO departures to destinations inside NCT, transcribed
# from the ZOA route reference tool (https://reference.oakartcc.org/routes?dep=SFO&dest=<FAA>) on
# 2026-09-15. The tool prints `[SFOW]`/`[SFOE]` plans, `(1)`/`(28)` departure-runway tags, and ends a row
# with its altitudes in hundreds of feet. A printed pair (`030/090`) is the initial altitude the TEC route
# is issued with and the final altitude it assigns, and records both `initial_altitude_feet` and
# `final_altitude_feet`. A single number — a blank final (`050/`) or a bare number (`060`) — is the final
# altitude alone and records `final_altitude_feet` only: the altitude the route is issued with is then the
# one the SOP row that assigns the departure states, and is not transcribed here (user 2026-09-16). Every
# KSFO row prints a single number, so no row here states an initial altitude; a row the tool prints with
# no altitude at all carries neither key.
# SIDs are written with `#` in place of the version so a cycle bump does not stale the row; the engine
# substitutes the current procedure.
# `kind: adr` marks an assigned departure route, which is advisory; a row without the key is a TEC
# route. `runway_families` empty = every departure runway of the plan. SOP 2-1 b: issue TEC routes for
# destinations within NCT except RNO and satellites; if a pilot cannot accept one, vectors direct.
source:
  title: ZOA Reference Tool, TEC/AAR/ADR Routes
  url: https://reference.oakartcc.org/routes
  transcribed_at: 2026-09-15

