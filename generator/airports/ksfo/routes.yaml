# Radio telephony for the airlines in the fleet list (S1-SFO-0 CBT airline table plus FAA 7340.2 entries);
# entries marked verify were not on the CBT table and get confirmed in the validation loop.
telephony:
  AAL: American
  AAY: Allegiant
  ABX: Abex
  ACA: Air Canada
  ASA: Alaska
  ATN: Air Transport
  CKS: Connie
  CLX: Cargolux
  DAL: Delta
  EJA: ExecJet
  FDX: FedEx
  FFT: Frontier Flight
  GTI: Giant
  JBU: JetBlue
  JSX: BigStripe
  KAL: Korean Air
  LXJ: Flexjet
  NAX: Nor Shuttle
  NCA: Nippon Cargo
  NKS: Spirit Wings
  QXE: Horizon
  SKW: SkyWest
  SWA: Southwest
  TWY: Twilight
  UAL: United
  UPS: UPS
  VOI: Volaris
  XOJ: XOJet

# ICAO codes of the all-cargo carriers among the telephony entries: a flight of one of these is a cargo
# flight, which is what SOP 2-1 e sends off the 28s for performance when runway 01 is the advertised
# departure runway. Callsigns from FAA JO 7340.2 chapter 3: Giant, Abex, Air Transport, Cargolux,
# Connie, Nippon Cargo.
cargo_airlines: [FDX, UPS, GTI, ABX, ATN, CLX, CKS, NCA]

# `class` is asserted against vNAS EngineType at build time. `ceiling_feet` is the certified service ceiling
# used by the amendment-mode altitude check. `suffixes` are the equipment suffixes this type normally files.
fleet:
  - { type: A320, class: J, wtc: M, ceiling_feet: 39800, suffixes: [/L], airlines: [UAL, FFT, NKS, ACA, AAY, VOI, JBU] }
  - { type: A20N, class: J, wtc: M, ceiling_feet: 39800, suffixes: [/L], airlines: [FFT, VOI, JBU] }
  - { type: A319, class: J, wtc: M, ceiling_feet: 39800, suffixes: [/L], airlines: [AAY, UAL] }
  - { type: B737, class: J, wtc: M, ceiling_feet: 41000, suffixes: [/L], airlines: [SWA, ASA] }
  - { type: B738, class: J, wtc: M, ceiling_feet: 41000, suffixes: [/L], airlines: [DAL, SWA, UAL, ASA] }
  - { type: B752, class: J, wtc: M, ceiling_feet: 42000, suffixes: [/L], airlines: [FDX, UPS, DAL, UAL] }
