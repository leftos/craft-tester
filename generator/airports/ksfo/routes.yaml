# Scenario library: the destinations, airlines, fleet and realistic filed routes of KSFO. Routes come from
# the S1-SFO-1 practice worksheets and the ZOA route reference tool. What a destination, an airline or an
# aircraft type is holds at every airport, so this file lists only codes: the facts sit in
# generator/shared/destinations.yaml, generator/shared/airlines.yaml and generator/shared/aircraft_types.yaml.

# The destinations KSFO scenarios file to; the order is the order the draw sees them in.
destinations: [KSEA, KPDX, KBFI, KBLI, KBOI, KSLC, KJAC, KDEN, KLAS, KLAX, KSAN, KBUR, KONT, KCRQ, KSMO, KVNY, KSNA, KLGB, KUDD, KSBA, KMCI, KGPZ, KRNO, KTRK, KSMF, KFAT, KACV, KMRY, KLVK, KAPC, KWVI, KMYV, KOVE, O88, KSAC, KOAK, KSJC, PHNL, RKSI, ESSA, MMMX, CYVR]

# The airlines that fly out of KSFO: their telephony is read on frequency, and the all-cargo ones among
# them make a flight a cargo flight for the runway rules.
airlines: [AAL, AAY, ABX, ACA, ASA, ATN, CKS, CLX, DAL, EJA, FDX, FFT, GTI, JBU, JSX, KAL, LXJ, NAX, NCA, NKS, QXE, SKW, SWA, TWY, UAL, UPS, VOI, XOJ]

# The aircraft types a KSFO scenario can draw; an airline flies one when generator/shared/airlines.yaml
# lists the type for it.
fleet: [A320, A20N, A319, B737, B738, B752, B77L, B788, A306, MD11, E75L, E135, CL30, GL5T, C750, C55B, C25B, C510, E55P, B350, BE20, TBM9, C172, SR22, M20T]

# Filed routes, keyed by the fix where the aircraft leaves the SID. `tail` starts at that fix. `classes`
# limits which aircraft classes fly it; `altitudes` are plausible filed cruise altitudes.
# A tail that ends on an arrival names the family and lets the build supply the revision the CIFP
# publishes, `HAWKZ#` as `tec.yaml` does for DPs, so no revision is transcribed and none goes stale.
# A destination outside the FAA file has nothing to resolve against and names the arrival in full.
routes:
  # north via TRUKN/SNTNA/NIITE/CIITY transitions
  - { exit_fix: DEDHD, destination: KSEA, tail: DEDHD RBL LMT HAWKZ#, classes: [J], altitudes: [32000, 34000, 36000] }
  # CYVR is outside the FAA CIFP, so there is nothing to resolve a family against: this row names the
  # arrival in full and its revision is hand-maintained from the CZVR preferred-routing table
  # (https://czvr.ca/preferredrouting), which routes BTG J1 SEA PAE onto the GRIZZ arrival.
  - { exit_fix: DEDHD, destination: CYVR, tail: DEDHD LMT BTG J1 SEA PAE GRIZZ1, classes: [J], altitudes: [36000, 38000] }
  - { exit_fix: GRTFL, destination: KPDX, tail: GRTFL MACHU TMBRS#, classes: [J], altitudes: [34000, 36000] }
  - { exit_fix: GRTFL, destination: KBLI, tail: GRTFL OED J1 SEA PAE MADEE#, classes: [J], altitudes: [36000] }
  - { exit_fix: MOGEE, destination: KSLC, tail: MOGEE Q124 BVL BVL#, classes: [J], altitudes: [37000, 39000] }
  - { exit_fix: MOGEE, destination: KDEN, tail: MOGEE Q124 BVL TCH KAMPR LONGZ#, classes: [J], altitudes: [33000, 35000] }
  - { exit_fix: ORRCA, destination: KJAC, tail: ORRCA Q120 GALLI PARZZ TUVOC LEIDY DNW, classes: [J], altitudes: [37000, 41000] }
  - { exit_fix: ORRCA, destination: KGPZ, tail: ORRCA Q120 GALLI BAM J32 ABR FAR, classes: [J], altitudes: [37000] }
  - { exit_fix: ORRCA, destination: KRNO, tail: ORRCA TARVR SPOON, classes: [J], altitudes: [21000, 23000] }
  - { exit_fix: ORRCA, destination: KBOI, tail: ORRCA ANAHO PRNCS SADYL#, classes: [J], altitudes: [37000, 41000] }
  - { exit_fix: TIPRE, destination: KMCI, tail: TIPRE Q126 INSLO DTA RLG AKO MCK DPEAK JSONN#, classes: [J], altitudes: [37000, 41000] }
  - { exit_fix: TIPRE, destination: KSLC, tail: TIPRE Q126 KREYK BVL BVL#, classes: [J], altitudes: [39000, 41000] }
  - { exit_fix: SYRAH, destination: KDEN, tail: SYRAH Q128 JSICA MLF J28 BDROC HAQHY SSKII#, classes: [J], altitudes: [37000, 41000] }
  # south via SSTIK/WESLA/SEGUL/SAHEY transitions
  - { exit_fix: SUSEY, destination: KLAX, tail: SUSEY EBAYE BURGL IRNMN#, classes: [J], altitudes: [33000, 35000] }
  - { exit_fix: NTELL, destination: KLAS, tail: NTELL Q174 FLCHR COKTL#, classes: [J], altitudes: [33000, 35000] }
  - { exit_fix: NTELL, destination: KLAS, tail: NTELL Q162 ESSAA BTY PUMLE#, classes: [J], altitudes: [35000] }
  - { exit_fix: NTELL, destination: KFAT, tail: NTELL, classes: [J], altitudes: [17000, 19000] }
  - { exit_fix: KTINA, destination: KBUR, tail: KTINA CISKO RDHOT ROKKR#, classes: [J], altitudes: [31000] }
  - { exit_fix: YYUNG, destination: KSAN, tail: YYUNG LAX COMIX#, classes: [J], altitudes: [37000, 41000] }
  - { exit_fix: YYUNG, destination: KSBA, tail: YYUNG GVO HABUT, classes: [J], altitudes: [29000, 33000] }
  - { exit_fix: YYUNG, destination: KCRQ, tail: YYUNG LEGOZ LEGOZ#, classes: [J], altitudes: [37000] }
  # vector SID and radar-vector routes (GAPP7 / SFO5), props and turboprops
  - { exit_fix: OAK, destination: KTRK, tail: OAK V244 ALTAM V392 SAC V6 SWR TRUCK, classes: [P, T], altitudes: [15000, 17000] }
  - { exit_fix: SGD, destination: KACV, tail: SGD YAGER, classes: [T], altitudes: [16000, 18000] }
  # NCT destinations file the tails the TEC rows issue, one row per distinct tail, so every configuration,
  # class and suffix finds a clean row; altitudes sit at or below the TEC cap on the direction-of-flight
  # parity, and the draw rejects a row in the configurations where it is not the clean plan. Magnetic
  # courses: KSMF 016 odd, KMRY 144 odd, KWVI 132 odd, KLVK 066 odd, KOVE 003 odd, KAPC 353 even.
  - { exit_fix: TRUKN, destination: KSMF, tail: TRUKN FEVTA FEVTA#, classes: [T, J], altitudes: [7000, 9000] }
  - { exit_fix: CIITY, destination: KSMF, tail: CIITY FEVTA FEVTA#, classes: [T, J], altitudes: [7000, 9000] }
  - { exit_fix: OAK, destination: KSMF, tail: OAK V6 SAC, classes: [P], altitudes: [3000, 5000] }
  - { exit_fix: OAK, destination: KSMF, tail: OAK V244 ALTAM V392 SAC, classes: [P], altitudes: [3000, 5000] }
  - { exit_fix: EUGEN, destination: KMRY, tail: EUGEN, classes: [P, T], altitudes: [3000, 5000] }
  - { exit_fix: OSI, destination: KMRY, tail: OSI V25 SNS, classes: [P, T], altitudes: [3000, 5000] }
  - { exit_fix: EUGEN, destination: KWVI, tail: EUGEN, classes: [P, T], altitudes: [3000, 5000] }
  - { exit_fix: OSI, destination: KWVI, tail: OSI V25 SNS, classes: [P, T], altitudes: [3000, 5000] }
  - { exit_fix: TRUKN, destination: KLVK, tail: TRUKN ALTAM, classes: [T, J], altitudes: [3000, 5000] }
  - { exit_fix: TRUKN, destination: KLVK, tail: TRUKN, classes: [P], altitudes: [3000, 5000] }
  - { exit_fix: OAK, destination: KLVK, tail: OAK V244 ALTAM MOD, classes: [P, T], altitudes: [3000, 5000] }
  - { exit_fix: CIITY, destination: KLVK, tail: CIITY ALTAM, classes: [T, J], altitudes: [3000, 5000] }
  - { exit_fix: ORRCA, destination: KOVE, tail: ORRCA, classes: [T, J], altitudes: [7000, 9000] }
  - { exit_fix: OAK, destination: KOVE, tail: OAK V6 SAC, classes: [P, T], altitudes: [3000, 5000] }
  - { exit_fix: CIITY, destination: KOVE, tail: CIITY ALTAM, classes: [T, J], altitudes: [3000, 5000] }
  - { exit_fix: OAK, destination: KOVE, tail: OAK V244 ALTAM MOD, classes: [P, T], altitudes: [3000, 5000] }
  - { exit_fix: SAU, destination: KAPC, tail: SAU, classes: [P, T], altitudes: [4000] }
  # The tail stops at Middleton Island: SMA and the oceanic fixes beyond it are outside the FAA CIFP, so nothing can name them on frequency.
  - { exit_fix: RBL, destination: RKSI, tail: RBL J1 OED J501 TOU J523 YZT J502 ANN J195 BKA J605 MDO, classes: [J], altitudes: [28000, 30000] }
  - { exit_fix: SAC, destination: KBOI, tail: SAC ANAHO, classes: [J], altitudes: [39000, 41000] }
  # oceanic
  - { exit_fix: BEBOP, destination: PHNL, tail: BEBOP R464 BILLO R464 BITTA MAGGI#, classes: [J], altitudes: [30000, 34000] }
