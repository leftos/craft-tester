# SOP 2-2 c: the interim-altitude table below applies to every SFO departure, regardless of whether the SID
# publishes a top altitude (user review 2026-09-15, DAL653 on a TRUKN2 with a published FL190 top). A SID
# with published crossing restrictions is phrased "climb via SID except maintain (interim)"; one without
# them is phrased "maintain (interim)" (see `phraseology_rules`). "CVS x" in the SOP means "climb via SID
# except maintain". Ordered; first match wins.
altitude_rules:
  - id: SFOW-28-3000
    source: "SFO ATCT SOP 2-2 c ii; S1-SFO-0 CBT (GAPP#/SFO# maintain 3000; MOLEN#/WESLA# and the SEGUL# predecessor climb via SID except maintain 3000); user review 2026-09-15 (DAL653): the table applies even when a top altitude is published"
    text: "SFOW: GAPP#, MOLEN#, SEGUL#, SFO#, WESLA#, runway 28, P/T/J -> 3,000 or CVS x 3,000"
    plan: SFOW
    runway_families: ["28"]
    classes: [P, T, J]
    sid_families: [GAPP, MOLEN, SEGUL, SFO, WESLA]
    outcome: { kind: interim, feet: 3000 }
    when_top_altitude_published: interim
    expect_after_minutes: 10
  - id: SFOW-PT-5000
    source: "SFO ATCT SOP 2-2 c ii; S1-SFO-0 CBT (GAPP#/SFO# RWY 1: props/turboprops 5000); user review 2026-09-15 (DAL653): the table applies even when a top altitude is published"
    text: "SFOW: all others, runways 01/28, P/T -> 5,000 or CVS x 5,000"
    plan: SFOW
    runway_families: ["01", "28"]
    classes: [P, T]
    outcome: { kind: interim, feet: 5000 }
    when_top_altitude_published: interim
    expect_after_minutes: 10
  - id: SFOW-J-10000
    source: "SFO ATCT SOP 2-2 c ii; S1-SFO-0 CBT (GAPP#/SFO# RWY 1: jets 10000); user review 2026-09-15 (DAL653): the table applies even when a top altitude is published"
    text: "SFOW: all others, runways 01/28, J -> 10,000 or CVS x 10,000"
    plan: SFOW
    runway_families: ["01", "28"]
    classes: [J]
    outcome: { kind: interim, feet: 10000 }
    when_top_altitude_published: interim
    expect_after_minutes: 10
  - id: SFOE-PT-5000
    source: "SFO ATCT SOP 2-2 c iii; S1-SFO-0 CBT (GAPP#/MOLEN# RWY 10s/19s: PT 5000); user review 2026-09-15 (DAL653): the table applies even when a top altitude is published"
    text: "SFOE: all, runways 10/19, P/T -> 5,000 or CVS x 5,000"
    plan: SFOE
    runway_families: ["10", "19"]
    classes: [P, T]
    outcome: { kind: interim, feet: 5000 }
    when_top_altitude_published: interim
    expect_after_minutes: 10
  - id: SFOE-J-15000
    source: "SFO ATCT SOP 2-2 c iii; S1-SFO-0 CBT (GAPP#/MOLEN# RWY 10s/19s: jets 15000); user review 2026-09-15 (DAL653): the table applies even when a top altitude is published"
    text: "SFOE: all, runways 10/19, J -> 15,000 or CVS x 15,000"
    plan: SFOE
    runway_families: ["10", "19"]
    classes: [J]
    outcome: { kind: interim, feet: 15000 }
    when_top_altitude_published: interim
    expect_after_minutes: 10

# Operational notices that change which SIDs are available. `sid_off` removes every assignment row for
# that SID family while the notice is active, so the next compatible row applies (here SSTIK#/WESLA# with
# the YYUNG transition). Scenarios may present a notice as active or inactive so both states get drilled.
notices:
  - id: SFO-SEGUL-OFF
    source: ZOA operational notice relayed by the user, 2026-09-15
    dated: 2026-09-15
    text: "SFO/OAK SEGUL/COAST SID: OFF. Issue SSTIK#/WESLA#/CNDEL# YYUNG. CFG: SFOW"
    plan: SFOW
    effect: { kind: sid_off, sid_family: SEGUL }
    default_active: true

# Airport-level phraseology toggles. Defaults follow FAA JO 7110.65 4-3-2; the validation loop may flip them.
phraseology:
  # User rule 2026-09-15: the expect clause is redundant when the final altitude is as filed and the SID chart already publishes "expect filed altitude N minutes after departure"; the SOP's non-standard-interim three-minute clause is the override.
  expect_altitude: unless_chart_publishes_it
  non_standard_interim_expect_minutes: 3
  vector_hybrid_transitions_spoken: false

# Rule text the engine cites for phrasing decisions that are not SOP rows.
phraseology_rules:
  - id: R-TRANSITION
    source: "FAA JO 7110.65 4-3-2 c 5; ZOA CRAFT Phraseology reference"
    text: "(SID name and number) DEPARTURE, (transition name) TRANSITION, THEN AS FILED — used when the first filed fix after the SID is one of its published transitions"
  - id: R-AS-FILED
    source: "FAA JO 7110.65 4-3-2 c 5; ZOA CRAFT Phraseology reference"
    text: "(SID name and number) DEPARTURE, (fix), THEN AS FILED — used when the first filed fix after the SID is not one of its published transitions, including the SID's own base fix; the fix is spoken bare, without a facility word"
  - id: R-RV-SID
    source: "FAA JO 7110.65 4-3-2 c 5 / ZOA practice; ZOA CRAFT Phraseology reference"
    text: "(SID name and number) DEPARTURE, RADAR VECTORS (fix), THEN AS FILED — used for radar-vector and vector-segment SIDs"
  - id: R-RV-AIRWAY
    source: ZOA CRAFT Phraseology reference
    text: "(SID name and number) DEPARTURE, RADAR VECTORS TO JOIN (airway), THEN AS FILED — used when the first filed element after the SID is an airway"
  - id: R-AIRWAY
    source: "FAA JO 7110.65 2-5-1; ZOA CRAFT Phraseology reference; user review 2026-09-15"
    text: "Airways are spoken as the word VICTOR or TANGO, or the letter J or Q, followed by the number in group form (Victor two forty-four, Jay five thirty-three, Queue one seventy-four, Tango two ten); other route letters phonetically"
  - id: R-NAVAID
    source: "FAA JO 7110.65 2-5-2; ZOA practice (S1-OAK-2 knowledge check: RADAR VECTORS LINDEN VOR); user review 2026-09-15"
    text: "A navaid in a clearance is spoken by name followed by its facility type; VOR, VOR/DME and VORTAC are all VOR (Sacramento VOR, Red Bluff VOR); transitions keep their published name"
  - id: RWY-CLASS-DEFAULT
    source: "SFO ATCT SOP 1-7; user review 2026-09-15 (N483KA)"
    text: "The configuration departs this aircraft class from this runway by default, before the direction-of-turn split: in 28/01, props and turboprops depart 28R at intersection Echo, a short taxi from the north ramp"
  - id: RWY-ON-REQUEST
    source: "SFO ATCT SOP 2-1 e; user review 2026-09-15 (FDX1563, UPS2896)"
    text: "Oceanic, Far East and cargo flights usually need 28L/R for performance; when 01 is the advertised departure runway they may be issued 28L/R and the matching SID. A strip remark requesting the 28s, or a cargo or heavy flight filing a 28-only SID, is honoured"
  - id: RWY-DIRECTION
    source: "S1-SFO-0 CBT, Runway Assignment: 28/01 1L or 1R?"
    text: "The departure runway follows the first turn: right turn (northbound SIDs) 1R, left turn (southbound SIDs) 1L, which allows simultaneous parallel departures; the same table splits the 28s and the SFOE families"
  - id: RWY-FIRST
    source: "SFO ATCT SOP 1-7"
    text: "The configuration departs a single runway of this family for this aircraft class, so that runway is issued"
  - id: A-CLIMB-VIA
    source: "FAA JO 7110.65 4-3-2 c 4 (a); ZOA CRAFT Phraseology reference"
    text: "CLIMB VIA SID — the SID has published crossing restrictions and its published top altitude is the altitude ATC wants; at KSFO the SOP interim table applies to every SID, so this form does not occur in clearance mode"
  - id: A-CLIMB-VIA-EXCEPT
    source: "FAA JO 7110.65 4-3-2 c 4 (b); ZOA CRAFT Phraseology reference"
    text: "CLIMB VIA SID EXCEPT MAINTAIN (altitude) — the SID has published crossing restrictions but no top altitude is published or ATC needs an interim altitude"
  - id: A-MAINTAIN
    source: "FAA JO 7110.65 4-3-2 c 5; ZOA CRAFT Phraseology reference"
    text: "MAINTAIN (altitude) — the SID has no published crossing restrictions, or is a radar-vector SID or has a radar-vector segment"
  - id: A-EXPECT
    source: "FAA JO 7110.65 4-3-2 c 3 / SFO ATCT SOP 2-2 c iv; ZOA CRAFT Phraseology reference"
    text: "EXPECT (filed altitude) (minutes) MINUTES AFTER DEPARTURE — spoken when the filed altitude is above the altitude cleared to and the SID chart does not itself publish the expect note; three minutes when a non-standard interim altitude is issued (SFO ATCT SOP 2-2 c iv)"
  - id: C-DEST
    source: "FAA JO 7110.65 4-3-2 a; ZOA CRAFT Phraseology reference"
    text: "CLEARED TO (destination) AIRPORT — the clearance limit is the destination airport"
