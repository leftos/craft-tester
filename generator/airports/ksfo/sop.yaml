# Hand transcription of the San Francisco ATCT SOP, section 2-2 (IFR Departures), section 1-7
# (runway configurations) and section 2-4 (noise abatement). Every rule row carries the SOP text it
# came from so the game can cite it. Re-transcribe when `craft-gen verify-sop` reports a hash change.
source:
  title: San Francisco ATCT Standard Operating Procedure
  version: "1.11"
  url: https://oakartcc.org/controllers/file/9a2b1e84-5e65-11e9-8010-2a32edb55910
  sha256: 1e2b90c75d274b836929963fe353c5ef4a5dc592cd6fa005bf7fa3e77318e008
  transcribed_at: 2026-09-15
  sentinels:
    - "Version 1.11"
    - "2-2 IFR Departures"
    - "3,000 or CVS x 3,000"
    - "SNTNA# shall be used instead of TRUKN# off Runways 28 while in 28/01 configuration"
    - "expect filed altitude three (3) minutes after departure"

# Secondary source: ZOA training deck "S1 KSFO Clearance Delivery, Ground Control, Gate Hold" (S1-SFO-0
# CBT, dated 2023-02-26, Google Slides 1yqKhIdUYZlHxmA-mWC_UIX1A1jb7kuMJO3vu_ApTbV8). It is older than the
# SOP: it describes the OFFSH# departure, which no longer exists (not in the charts API or the SOP); its
# role is filled by SEGUL ONE. Where the deck and the SOP disagree, the SOP wins. Rows that come from the
# deck cite "S1-SFO-0 CBT" with the slide title.
secondary_sources:
  - id: cbt
    title: S1 KSFO Clearance Delivery, Ground Control, Gate Hold (S1-SFO-0 CBT)
    dated: 2023-02-26
    url: https://docs.google.com/presentation/d/1yqKhIdUYZlHxmA-mWC_UIX1A1jb7kuMJO3vu_ApTbV8
  # The ZOA CRAFT Phraseology reference carries no date of its own, so `dated` is the day it was
  # retrieved. It is the source for the phraseology rows below: the transition, radar-vector,
  # airway and as-filed forms, and the full-route grammar.
  - id: craft_phraseology
    title: ZOA CRAFT Phraseology reference
    dated: 2026-09-15
    url: https://docs.google.com/document/d/1Jq0uqpuhIZRSfKvYbyJvAplT1h6zf-wMhcAN6MAQC6k

airport:
  icao: KSFO
  faa: SFO
  spoken: San Francisco
  clearance_delivery: "118.2"

runways: [01L, 01R, 10L, 10R, 19L, 19R, 28L, 28R]

# SOP 1-7. departure_runways lists which runways each aircraft class departs from in that configuration.
# In 28/01, oceanic, Far East and cargo flights may be given 28L/R for performance (SOP 2-1 e).
# training_weight is how often the scenario generator draws the configuration relative to the others,
# a training mix rather than SOP data.
runway_configs:
  - id: "01/01"
    source: "SFO ATCT SOP 1-7"
    name: Landing and departing runways 01
    plan: SFOW
    training_weight: 4
    arrival_runways: [01L, 01R]
    departure_runways:
      - { runway: 01L, classes: [P, T, J] }
      - { runway: 01R, classes: [P, T, J] }
  # The 28s carry two kinds of departure here: the jets the SOP sends off them for performance, and
  # the GA traffic that departs 28R at intersection Echo, which is a separate row because it is the
  # default runway for those classes rather than a performance exception.
  - id: "28/01"
    source: "SFO ATCT SOP 1-7"
    name: Landing runways 28, departing runways 01
    plan: SFOW
    training_weight: 55
    arrival_runways: [28L, 28R]
    departure_runways:
      - { runway: 01L, classes: [P, T, J] }
      - { runway: 01R, classes: [P, T, J] }
      - { runway: 28L, classes: [J], on_request_for: [cargo, heavy, oceanic], note: "oceanic, Far East and cargo flights for performance (SOP 2-1 e); a cargo or heavy flight filing a 28-only SID is treated as requesting the 28s (user review 2026-09-15)" }
      - { runway: 28R, classes: [J], on_request_for: [cargo, heavy, oceanic], note: "oceanic, Far East and cargo flights for performance (SOP 2-1 e); a cargo or heavy flight filing a 28-only SID is treated as requesting the 28s (user review 2026-09-15)" }
      - { runway: 28R, classes: [P, T], default_for_classes: [P, T], note: "GA up to light jets depart 28R at intersection Echo, a short taxi from the north ramp with enough runway remaining (user review 2026-09-15, N483KA); jets stay on the 01s until a GA flag exists on the fleet" }
  - id: "28 RT"
    source: "SFO ATCT SOP 1-7"
    name: Landing and departing runways 28, right turn (TRUKN DP in use)
    plan: SFOW
    training_weight: 15
    arrival_runways: [28L, 28R]
    departure_runways:
      - { runway: 28L, classes: [P, T, J] }
      - { runway: 28R, classes: [P, T, J] }
  - id: "28 SO"
    source: "SFO ATCT SOP 1-7"
    name: Landing and departing runways 28, straight out (TRUKN DP not in use)
    plan: SFOW
    training_weight: 8
    arrival_runways: [28L, 28R]
    departure_runways:
      - { runway: 28L, classes: [P, T, J] }
      - { runway: 28R, classes: [P, T, J] }
  - id: "10/10"
    source: "SFO ATCT SOP 1-7"
    name: Landing and departing runways 10
    plan: SFOE
    training_weight: 4
    arrival_runways: [10L, 10R]
    departure_runways:
      - { runway: 10L, classes: [P, T, J] }
      - { runway: 10R, classes: [P, T, J] }
  - id: "19/10"
    source: "SFO ATCT SOP 1-7"
    name: Landing runways 19, departing runways 10
    plan: SFOE
    training_weight: 10
    arrival_runways: [19L, 19R]
    departure_runways:
      - { runway: 10L, classes: [P, T, J] }
      - { runway: 10R, classes: [P, T, J] }
  - id: "19/19"
    source: "SFO ATCT SOP 1-7"
    name: Landing and departing runways 19
    plan: SFOE
    training_weight: 4
    arrival_runways: [19L, 19R]
    departure_runways:
      - { runway: 19L, classes: [P, T, J] }
      - { runway: 19R, classes: [P, T, J] }

# NCT Area D departure sectors. Frequencies from the ZOA positions reference (Area D Richmond, Area D Sutro)
# and the FAA charts (NORCAL DEP CON 120.9 NW-E / 135.1 SE-W).
departure_sectors:
  - { id: richmond, name: NorCal Richmond, frequency: "120.9" }
  - { id: sutro, name: NorCal Sutro, frequency: "135.1" }

# Staffing fallbacks (S1-SFO-0 CBT, "Departure Frequency"): Area D may be combined on Sutro; with Area D
# offline departures go to NCT combined 133.95; with NCT offline, Oakland Center combined 132.2. The game
# assumes both Area D sectors are online unless a scenario says otherwise.
departure_staffing_fallbacks:
  - { id: area_d_combined, name: NorCal Sutro (Area D combined), frequency: "135.1" }
  - { id: nct_combined, name: NorCal Approach (combined), frequency: "133.95" }
  - { id: center_combined, name: Oakland Center (combined), frequency: "132.2" }

# In 28/01, the departure runway follows the first turn (S1-SFO-0 CBT, "Runway Assignment: 28/01 1L or 1R?"):
# right turn (northbound SIDs) -> 1R, left turn (southbound SIDs) -> 1L, which is what allows simultaneous
# parallel departures. Heavies and 28-only SIDs go to 28L when parked south of 28L, 28R when north of 28R.
direction_runway_preference:
  SFOW:
    north: { "01": 01R, "28": 28L }
    south: { "01": 01L, "28": 28L }
    oceanic: { "01": 01L, "28": 28L }
  SFOE:
    north: { "10": 10L, "19": 19L }
    south: { "10": 10R, "19": 19R }
    oceanic: { "10": 10R, "19": 19R }

# Distractor pool for the frequency dropdown.
frequencies:
  - { label: San Francisco Clearance, value: "118.2" }
  - { label: San Francisco Ground, value: "121.8" }
  - { label: San Francisco Ground 2 / Gate Hold, value: "124.25" }
  - { label: San Francisco Tower, value: "120.5" }
  - { label: NorCal Departure (Richmond), value: "120.9" }
  - { label: NorCal Departure (Sutro), value: "135.1" }
  - { label: NorCal Approach (Boulder), value: "133.95" }
  - { label: NorCal Approach (Woodside), value: "135.65" }
  - { label: NorCal Departure (Diablo), value: "127.0" }
  - { label: NorCal Departure (Fairfield), value: "124.325" }
  - { label: NorCal Departure (Quake), value: "127.975" }
  - { label: Oakland Center (combined), value: "132.2" }

# Exit fix -> SOP direction. Named SID transitions come from CIFP; radar-vector and vector-SID fixes are
# hand-assigned from the charts and the worksheets. Extend during validation when a filed route exits
# somewhere new.
gates:
  north: [DEDHD, GRTFL, MOGEE, ORRCA, SYRAH, TIPRE, GOBBS, TRUKN, SNTNA, NIITE, CIITY, RBL, RDD, SAC, CCR, OAK, SGD, SAU, ENI, LKV, LIN, SUNOL]
  south: [KAYEX, KTINA, NTELL, SUSEY, YYUNG, PORTE, SAHEY, SSTIK, WESLA, OSI, EUGEN, SNS, CISKO, EBAYE, LOSHN, WAGES, AVE, LHS, BOILE, SJC, GILRO, MCKEY, FLW, GVO, RZS, SXC, EHF]
  oceanic: [ALCOA, AMAKR, BEBOP, CINNY, GNNRR, MOLEN, STINS, ALLBE, BAART, ALANN]

# Departure without a SID is only available from runways 01 and 10 and is phrased as radar vectors to
# the first filed fix (S1-SFO-0 CBT, "No SID"). Common first fixes: OSI, OAK, SJC, GOBBS, SUNOL, GILRO.
no_sid:
  runway_families: ["01", "10"]
  phrasing: radar_vectors_fix

# SOP 2-4. Local times; `sunday_end` replaces `end` on Sundays.
noise_windows:
  - { id: night, start: "22:00", end: "07:00", sunday_end: "08:00" }
  - { id: late_night, start: "01:00", end: "05:00" }

# SOP 2-2 a (standard DP by destination direction, runway, aircraft class) and 2-4 e (noise abatement).
# Ordered: the engine takes the first row whose conditions match and whose SID is compatible with the
# departure runway, the aircraft's RNAV capability and the filed exit fix. Noise rows come first.
assignment_rules:
  - id: SFOW-NOISE-N-NIITE
    source: SFO ATCT SOP 2-4 e
    text: "Noise abatement (2200L-0700L, 0800L Sun): Northbound, runways 01/28, P/T/J -> NIITE#"
    plan: SFOW
    direction: north
    runway_families: ["01", "28"]
    classes: [P, T, J]
    sid_family: NIITE
    sector: richmond
    when: { noise_window: night, rnav: true }
  - id: SFOW-NOISE-S-NIITE-GOBBS
    source: SFO ATCT SOP 2-4 e
    text: "Noise abatement 0100L-0500L: Southbound, runway 01, P/T/J -> NIITE# GOBBS"
    plan: SFOW
    direction: south
    runway_families: ["01"]
    classes: [P, T, J]
    sid_family: NIITE
    sector: sutro
    when: { noise_window: late_night, rnav: true, forced_transition: GOBBS }
  - id: SFOW-NOISE-P-RWY
    source: SFO ATCT SOP 2-4 e
    text: "Noise abatement: runway 01, non-RNAV props -> runway heading (no DP)"
    plan: SFOW
    direction: any
    runway_families: ["01"]
    classes: [P]
    sid_family: null
    non_dp_heading: runway heading
    sector: richmond
    when: { noise_window: night, rnav: false }

  - id: SFOW-N-TRUKN-01
    source: "SFO ATCT SOP 2-2 a (SFOW Northbound); S1-SFO-0 CBT (TRUKN#: RWY 28R/L, RWY 1R); user review 2026-09-15: SOP table wins over the CBT"
    text: "Northbound, runways 01/28, P/T/J -> TRUKN# (Richmond); off the 01s TRUKN departs 1R (right turn)"
    plan: SFOW
    direction: north
    runway_families: ["01"]
    classes: [P, T, J]
    sid_family: TRUKN
    sector: richmond
    when: { rnav: true }
  - id: SFOW-N-TRUKN-28
    source: "SFO ATCT SOP 2-2 a (SFOW Northbound) and 1-7 (28 RT); S1-SFO-0 CBT; user review 2026-09-15: SOP table wins over the CBT"
    text: "Northbound, runways 28, P/T/J -> TRUKN# when the TRUKN DP is in use (28 RT)"
    plan: SFOW
    direction: north
    runway_families: ["28"]
    classes: [P, T, J]
    sid_family: TRUKN
    sector: richmond
    when: { rnav: true, configs: ["28 RT"] }
  - id: SFOW-N-SNTNA-28
    source: "SFO ATCT SOP 2-2 a (SFOW Northbound, footnote); S1-SFO-0 CBT (SNTNA#: issue if requested or in 28SO); user review 2026-09-15: SOP table wins over the CBT"
    text: "Northbound, runways 28, P/T/J -> SNTNA#; SNTNA# shall be used instead of TRUKN# off runways 28 while in 28/01 configuration, when the TRUKN DP is not in use (28 SO), or on pilot request"
    plan: SFOW
    direction: north
    runway_families: ["28"]
    classes: [P, T, J]
    sid_family: SNTNA
    sector: richmond
    when: { rnav: true, not_configs: ["28 RT"] }
  - id: SFOW-N-SFO-01
    source: SFO ATCT SOP 2-2 a (SFOW Northbound)
    text: "Northbound, runway 01 -> SFO#; the fallback when the route does not fit an RNAV SID transition (non-RNAV aircraft, or an RNAV aircraft filed to a conventional fix such as RBL, SAC or CCR — the worksheets clear a B77L/L via SFO# RBL)"
    plan: SFOW
    direction: north
    runway_families: ["01"]
    classes: [P, T, J]
    sid_family: SFO
    sector: richmond
  - id: SFOW-N-GAPP-28
    source: SFO ATCT SOP 2-2 a (SFOW Northbound)
    text: "Northbound, runway 28 -> GAPP#; the fallback when the route does not fit an RNAV SID transition (non-RNAV aircraft, or an RNAV aircraft filed to a conventional fix such as OAK, SGD or RBL)"
    plan: SFOW
    direction: north
    runway_families: ["28"]
    classes: [P, T, J]
    sid_family: GAPP
    sector: richmond

  - id: SFOW-S-SEGUL
    source: "SFO ATCT SOP 2-2 a (SFOW Southbound); S1-SFO-0 CBT (Destination South Offshore: offshore route required by the ZLA LOA for SAN, typical for SNA/LGB; the deck's OFFSH# is today's SEGUL#)"
    text: "Southbound offshore (YYUNG), runways 01/28 -> SEGUL# (Sutro); SSTIK#.YYUNG / WESLA#.YYUNG are the RNAV alternates"
    plan: SFOW
    direction: south
    runway_families: ["01", "28"]
    classes: [J]
    sid_family: SEGUL
    sector: sutro
    when: { rnav: true, exit_fixes: [YYUNG] }
  - id: SFOW-S-SSTIK-01
    source: "SFO ATCT SOP 2-2 a (SFOW Southbound); S1-SFO-0 CBT (SSTIK#: RWY 1L only)"
    text: "Southbound, runway 01, J -> SSTIK# (Sutro); SSTIK departs 1L (left turn), allowing parallel departures with TRUKN# on 1R"
    plan: SFOW
    direction: south
    runway_families: ["01"]
    classes: [J]
    sid_family: SSTIK
    sector: sutro
    when: { rnav: true }
  - id: SFOW-S-WESLA-28
