    plan: SFOW
    direction: south
    runway_families: ["28"]
    classes: [J]
    sid_family: WESLA
    sector: sutro
    when: { rnav: true }
  - id: SFOW-S-GAPP
    source: SFO ATCT SOP 2-2 a (SFOW Southbound)
    text: "Southbound, runways 01/28, P/T/J -> GAPP# (Sutro)"
    plan: SFOW
    direction: south
    runway_families: ["01", "28"]
    classes: [P, T, J]
    sid_family: GAPP
    sector: sutro

  - id: SFOW-O-GNNRR-28
    source: SFO ATCT SOP 2-2 a (SFOW Oceanic)
