    phraseology: null

# Aircraft types the sheets file under a non-ICAO designator, mapped to the designator vNAS and the
# fleet use.
type_aliases:
  A32N: A20N

# Plans whose filed route and altitude the user has ruled replaced, e.g. a sheet written before an
# AIRAC change. Each row is a user ruling: the importer builds the plan's fixture from `route` and
# `altitude` (feet) instead of what `worksheet` prints for `callsign`, and the fixture's note records
# the printed plan and `reason`.
corrections:
  - worksheet: Phraseology Practice 2
    callsign: N436MS
    route: TRUKN2 TRUKN FEVTA FEVTA1
    altitude: 10000
    reason: "the sheet predates recent AIRAC changes; the plan's TEC route to KSMF is TRUKN2 TRUKN FEVTA FEVTA1 at 10,000, a clean replacement (user 2026-09-18)"
