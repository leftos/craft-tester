name: CI

on:
  push:
    paths-ignore: ["**.md"]
    branches: [main]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, format, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web lint
      - run: pnpm -C web fmt:check
      - run: pnpm -C web typecheck
      - run: pnpm -C web test
      - run: pnpm -C web build
      - name: schema export is committed
        run: |
          pnpm -C web schema:export
          git diff --exit-code -- data/schema

  generator:
    name: generator (ruff, ty, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: generator
          enable-cache: true
      - run: uv sync --frozen
        working-directory: generator
      - run: uv run ruff check .
        working-directory: generator
      - run: uv run ruff format --check .
        working-directory: generator
      - run: uv run ty check
        working-directory: generator
      - run: uv run pytest -q
        working-directory: generator
      # Network-enabled on purpose: the import fetches the Google Docs worksheets and the vNAS
      # aircraft specs. It needs no CIFP download, so it runs without a cache.
      - name: worksheet fixtures are up to date
        run: uv run craft-gen import-worksheets --airport KSFO --check
        working-directory: generator
