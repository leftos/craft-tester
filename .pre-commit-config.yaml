# Commits run only checks scoped to the staged files; the tsc and ty type checks run at pre-push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
      - id: check-json
        exclude: ^web/tsconfig.*\.json$
      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: web-lint
        name: web oxlint
        entry: pnpm -C web lint
        language: system
        files: ^(web/|data/)
        pass_filenames: false
      - id: web-fmt
        name: web oxfmt --check
        entry: pnpm -C web fmt:check
        language: system
        files: ^web/
        pass_filenames: false
      - id: web-typecheck
        name: web tsc --noEmit
        entry: pnpm -C web typecheck
        language: system
        files: ^(web/|data/)
        pass_filenames: false
        stages: [pre-push]
      - id: gen-ruff-check
        name: generator ruff check
        entry: uv run --directory generator ruff check .
        language: system
        files: ^generator/
        pass_filenames: false
      - id: gen-ruff-format
        name: generator ruff format --check
        entry: uv run --directory generator ruff format --check .
        language: system
        files: ^generator/
        pass_filenames: false
      - id: gen-ty
        name: generator ty check
        entry: uv run --directory generator ty check
        language: system
        files: ^generator/
        pass_filenames: false
        stages: [pre-push]
